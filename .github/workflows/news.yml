# Refreshes docs/news.json (the site's News tab) every 4 hours from free RSS feeds.
# Uses only Python's standard library, so nothing is installed and no secrets are needed.
name: Refresh midterm news

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch headlines
        run: python backend/news.py
      - name: Commit if the news changed
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/news.json
          if git diff --cached --quiet; then echo "No new stories."; exit 0; fi
          git commit -m "Refresh midterm news"
          git pull --rebase origin main
          git push
